<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur de Voyage - Japon (Automatisé)</title>
    <style>
        :root {
            --primary-color: #D32F2F;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
            --border-color: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .input-with-btn {
            display: flex;
            gap: 10px;
        }

        .input-with-btn input {
            flex-grow: 1;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1.1em;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-with-btn input:focus { border-color: var(--primary-color); }

        .search-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 25px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            transition: background 0.2s;
        }
        
        .search-btn:hover { background-color: #b71c1c; }
        .search-btn:disabled { background-color: #ef9a9a; cursor: wait; }

        .settings-bar {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            border: 1px solid var(--border-color);
        }

        select {
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9em;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th { background-color: #f9f9f9; color: var(--text-muted); }

        .total-section {
            margin-top: 20px;
            text-align: right;
            font-size: 1.3em;
            font-weight: bold;
            color: var(--primary-color);
            padding-top: 15px;
            border-top: 2px solid var(--border-color);
        }

        .delete-btn {
            background: none; border: none; color: #999; cursor: pointer; font-size: 1.2em;
        }
        .delete-btn:hover { color: var(--primary-color); }

        .badge {
            background-color: #e8f5e9; color: #2e7d32; padding: 4px 8px; border-radius: 12px; font-size: 0.85em; font-weight: bold;
        }
        .badge.high-crowd { background-color: #ffebee; color: #c62828; }

        #api-msg { font-size: 0.9em; margin-top: 10px; display: none; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎌 Planificateur Intelligent - Japon</h1>
        <p class="subtitle">Calcul automatique des durées et affluences (Base experte + OSM)</p>

        <div class="form-grid">
            <div class="input-with-btn">
                <input type="text" id="placeName" placeholder="Entrez un lieu (ex: Kinkakuji, Akihabara, Osaka Castle...)" onkeypress="if(event.key === 'Enter') analyzeAndAdd()">
                <button class="search-btn" id="searchBtn" onclick="analyzeAndAdd()">Ajouter</button>
            </div>
            <div id="api-msg">Analyse en cours...</div>
            
            <div class="settings-bar">
                <label for="style" style="font-size: 0.9em; color: var(--text-muted);">Votre rythme de voyage global :</label>
                <select id="style" onchange="recalculateAll()">
                    <option value="0.7">Rapide (Va à l'essentiel)</option>
                    <option value="1" selected>Normal (Prend le temps)</option>
                    <option value="1.5">Lent (Photos, flânerie)</option>
                </select>
            </div>
        </div>
    </div>

    <div class="container" id="resultsCard" style="display: none;">
        <h2>Votre Itinéraire</h2>
        <div style="overflow-x: auto;">
            <table id="itineraryTable">
                <thead>
                    <tr>
                        <th>Lieu</th>
                        <th>Type / Affluence</th>
                        <th>Durée sur place</th>
                        <th>Attente estimée</th>
                        <th>Durée Totale</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <div class="total-section" id="totalTimeDisplay">
            Temps total estimé : 0h 0min
        </div>
    </div>

        async function analyzeAndAdd() {
            const query = document.getElementById('placeName').value.trim().toLowerCase();
            const msgEl = document.getElementById('api-msg');
            const btn = document.getElementById('searchBtn');

            if (query.length < 3) return alert("Veuillez taper un nom de lieu valide.");

            btn.disabled = true;
            msgEl.style.display = 'block';
            msgEl.style.color = '#1976D2';
            msgEl.innerText = 'Recherche et analyse de l\'affluence...';

            let placeData = null;

            // Étape 1 : Vérification dans notre base de données "Experte"
            for (const key in japanHotspots) {
                if (query.includes(key)) {
                    placeData = { ...japanHotspots[key], source: 'db' };
                    break;
                }
            }

            // Étape 2 : Si non trouvé, on interroge OpenStreetMap en filet de sécurité
            if (!placeData) {
                try {
                    const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query + ' Japan')}&format=json&limit=1`;
                    const response = await fetch(url, { headers: { 'Accept-Language': 'fr' } });
                    const data = await response.json();

                    if (data && data.length > 0) {
                        const osmPlace = data[0];
                        const shortName = osmPlace.display_name.split(',')[0];
                        placeData = deduceFromOSM(osmPlace.type, shortName);
                    } else {
                        throw new Error("Lieu introuvable");
                    }
                } catch (error) {
                    msgEl.style.color = '#D32F2F';
                    msgEl.innerText = `❌ Lieu non trouvé. Soyez plus précis (ex: ajoutez "Tokyo" ou "Kyoto").`;
                    btn.disabled = false;
                    return;
                }
            }

            // Ajout à l'itinéraire
            itinerary.push({
                id: Date.now(),
                name: placeData.name,
                baseDuration: placeData.duration,
                waitTime: placeData.waitTime,
                crowdLevel: placeData.crowdLevel,
                type: placeData.type
            });

            msgEl.style.color = '#4CAF50';
            msgEl.innerText = `✨ Ajouté avec succès !`;
            
            document.getElementById('placeName').value = "";
            renderTable();
            setTimeout(() => { msgEl.style.display = 'none'; }, 2000);
            btn.disabled = false;
        }

        // 2. MOTEUR DE DÉDUCTION DE SECOURS (Basé sur OSM)
        function deduceFromOSM(osmType, name) {
            let duration = 60, wait = 10, crowd = "Moyenne", typeFr = "Attraction";

            if (['theme_park'].includes(osmType)) { duration = 300; wait = 90; crowd = "Forte"; typeFr = "Parc d'attractions"; }
            else if (['museum', 'castle'].includes(osmType)) { duration = 120; wait = 20; crowd = "Moyenne"; typeFr = "Culturel"; }
            else if (['park', 'garden', 'nature_reserve'].includes(osmType)) { duration = 90; wait = 0; crowd = "Faible"; typeFr = "Parc / Nature"; }
            else if (['place_of_worship', 'shrine', 'temple'].includes(osmType)) { duration = 60; wait = 15; crowd = "Moyenne"; typeFr = "Temple/Sanctuaire"; }
            else if (['retail', 'commercial', 'mall', 'marketplace'].includes(osmType)) { duration = 150; wait = 10; crowd = "Forte"; typeFr = "Shopping / Quartier"; }
            else if (['viewpoint', 'monument', 'artwork'].includes(osmType)) { duration = 20; wait = 5; crowd = "Faible"; typeFr = "Point de vue / Photo"; }

            return { name: name, duration: duration, waitTime: wait, crowdLevel: crowd, type: typeFr, source: 'osm' };
        }

        // 3. AFFICHAGE ET CALCULS
        function formatTime(minutes) {
            const h = Math.floor(minutes / 60);
            const m = Math.round(minutes % 60);
            if (h === 0) return `${m} min`;
            if (m === 0) return `${h}h`;
            return `${h}h ${m < 10 ? '0'+m : m}min`;
        }

        function renderTable() {
            const tableBody = document.getElementById('tableBody');
            const styleMultiplier = parseFloat(document.getElementById('style').value);
            tableBody.innerHTML = "";
            let totalMinutes = 0;

            if (itinerary.length === 0) {
                document.getElementById('resultsCard').style.display = "none";
                return;
            }

            document.getElementById('resultsCard').style.display = "block";

            itinerary.forEach(item => {
                const adjustedDuration = item.baseDuration * styleMultiplier;
                const totalPlaceTime = adjustedDuration + item.waitTime;
                totalMinutes += totalPlaceTime;

                const badgeClass = item.crowdLevel === "Forte" || item.crowdLevel === "Extrême" ? "badge high-crowd" : "badge";

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${item.name}</strong></td>
                    <td>${item.type}<br><span class="${badgeClass}">Affluence ${item.crowdLevel}</span></td>
                    <td>${formatTime(adjustedDuration)}</td>
                    <td>+ ${item.waitTime} min</td>
                    <td style="color: var(--primary-color); font-weight: bold;">${formatTime(totalPlaceTime)}</td>
                    <td><button class="delete-btn" onclick="removeItem(${item.id})" title="Supprimer">✖</button></td>
                `;
                tableBody.appendChild(row);
            });

            document.getElementById('totalTimeDisplay').innerText = `Temps total estimé : ${formatTime(totalMinutes)}`;
        }

        function recalculateAll() {
            renderTable(); // Recalcule tout en fonction du nouveau multiplicateur de rythme
        }

        function removeItem(id) {
            itinerary = itinerary.filter(item => item.id !== id);
            renderTable();
        }
    </script>
</body>
